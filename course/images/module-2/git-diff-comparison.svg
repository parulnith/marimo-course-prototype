<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">The same code edit in Jupyter and marimo Git diffs</title>
  <desc id="desc">Both notebooks change power from 3 to 4. The Jupyter diff also contains execution counts and regenerated image data. The marimo diff contains only the Python change.</desc>
  <style>
    .page { fill:#fbfbf9; }
    .card { fill:#fff; stroke:#d9d9d4; stroke-width:2; }
    .bar { fill:#f1f1ed; }
    .eyebrow { fill:#73736d; font:600 17px Inter,Arial,sans-serif; letter-spacing:1.2px; }
    .heading { fill:#20201e; font:650 29px Inter,Arial,sans-serif; }
    .file { fill:#555550; font:16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .code { fill:#30302d; font:18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .hunk { fill:#7253a3; }
    .delbg { fill:#ffebe9; }
    .addbg { fill:#dafbe1; }
    .del { fill:#a12d2d; }
    .add { fill:#176b36; }
    .note { fill:#666660; font:17px Inter,Arial,sans-serif; }
    .pill { fill:#e9f6ec; stroke:#b8dec1; }
    .pilltext { fill:#176b36; font:650 17px Inter,Arial,sans-serif; }
  </style>
  <rect class="page" width="1400" height="980"/>

  <text class="eyebrow" x="700" y="45" text-anchor="middle">SAME EDIT IN BOTH NOTEBOOKS</text>
  <rect class="pill" x="554" y="63" width="292" height="42" rx="21"/>
  <text class="pilltext" x="700" y="90" text-anchor="middle">power = 3  →  power = 4</text>

  <g transform="translate(40 135)">
    <rect class="card" width="1320" height="455" rx="12"/>
    <path class="bar" d="M12 0h1296a12 12 0 0 1 12 12v65H0V12A12 12 0 0 1 12 0z"/>
    <text class="heading" x="28" y="43">Jupyter notebook</text>
    <text class="file" x="1288" y="42" text-anchor="end">2_3_jupyter_diff_demo.ipynb</text>

    <text class="code" x="30" y="112">diff --git a/2_3_jupyter_diff_demo.ipynb b/2_3_jupyter_diff_demo.ipynb</text>
    <text class="code hunk" x="30" y="146">@@ -2,7 +2,7 @@</text>
    <text class="code" x="45" y="179">   "cell_type": "code",</text>
    <rect class="delbg" x="25" y="193" width="1270" height="34" rx="4"/>
    <text class="code del" x="42" y="216">-  "execution_count": 11,</text>
    <rect class="addbg" x="25" y="231" width="1270" height="34" rx="4"/>
    <text class="code add" x="42" y="254">+  "execution_count": 13,</text>

    <text class="code hunk" x="30" y="293">@@ -27,13 +27,13 @@</text>
    <rect class="delbg" x="25" y="307" width="1270" height="34" rx="4"/>
    <text class="code del" x="42" y="330">-  "execution_count": 12,</text>
    <rect class="addbg" x="25" y="345" width="1270" height="34" rx="4"/>
    <text class="code add" x="42" y="368">+  "execution_count": 15,</text>
    <rect class="delbg" x="25" y="383" width="625" height="34" rx="4"/>
    <text class="code del" x="42" y="406">-  "power = 3\n",</text>
    <rect class="addbg" x="670" y="383" width="625" height="34" rx="4"/>
    <text class="code add" x="687" y="406">+  "power = 4\n",</text>
    <text class="note" x="30" y="442">The diff continues with the regenerated image/png output.</text>
  </g>

  <g transform="translate(40 620)">
    <rect class="card" width="1320" height="320" rx="12"/>
    <path class="bar" d="M12 0h1296a12 12 0 0 1 12 12v65H0V12A12 12 0 0 1 12 0z"/>
    <text class="heading" x="28" y="43">marimo notebook</text>
    <text class="file" x="1288" y="42" text-anchor="end">2_3_marimo_diff_demo.py</text>

    <text class="code" x="30" y="112">diff --git a/2_3_marimo_diff_demo.py b/2_3_marimo_diff_demo.py</text>
    <text class="code hunk" x="30" y="146">@@ -16,7 +16,7 @@ def _():</text>
    <text class="code" x="45" y="179"> @app.cell</text>
    <text class="code" x="45" y="212"> def _():</text>
    <rect class="delbg" x="25" y="226" width="625" height="34" rx="4"/>
    <text class="code del" x="42" y="249">-    power = 3</text>
    <rect class="addbg" x="670" y="226" width="625" height="34" rx="4"/>
    <text class="code add" x="687" y="249">+    power = 4</text>
    <text class="code" x="45" y="293">     return (power,)</text>
  </g>
</svg>
